apiVersion: lambda.aws.upbound.io/v1beta1
kind: Function
metadata:
  name: vgurukool-contact-handler
  annotations:
    crossplane.io/external-name: vgurukool-contact-handler
  labels:
    app.kubernetes.io/name: vgurukool
    app.kubernetes.io/part-of: vgurukool-app
spec:
  forProvider:
    region: us-east-2
    runtime: python3.12
    handler: lambda_function.lambda_handler
    timeout: 15
    memorySize: 128
    role: arn:aws:iam::711387113105:role/vgurukool-cost-reporter-lambda-role
    s3Bucket: vgurukool-web-711387113105
    s3Key: lambda/contact-handler.zip
    environment:
      - variables:
          SNS_TOPIC_ARN: arn:aws:sns:us-east-2:711387113105:vgurukool-daily-cost-report
  providerConfigRef:
    name: aws-provider-config
---
apiVersion: lambda.aws.upbound.io/v1beta1
kind: FunctionURL
metadata:
  name: vgurukool-contact-handler-url
  labels:
    app.kubernetes.io/name: vgurukool
    app.kubernetes.io/part-of: vgurukool-app
spec:
  forProvider:
    region: us-east-2
    functionNameRef:
      name: vgurukool-contact-handler
    authorizationType: NONE
    cors:
      - allowOrigins:
          - "https://vgurukool.com"
          - "https://www.vgurukool.com"
          - "http://localhost:5173"
          - "http://localhost:3000"
        allowMethods:
          - "*"
        allowHeaders:
          - "content-type"
  providerConfigRef:
    name: aws-provider-config
---
apiVersion: lambda.aws.upbound.io/v1beta1
kind: Permission
metadata:
  name: vgurukool-contact-handler-public-invoke
  labels:
    app.kubernetes.io/name: vgurukool
    app.kubernetes.io/part-of: vgurukool-app
spec:
  forProvider:
    region: us-east-2
    action: lambda:InvokeFunctionUrl
    functionNameRef:
      name: vgurukool-contact-handler
    principal: "*"
    functionUrlAuthType: NONE
  providerConfigRef:
    name: aws-provider-config
---
apiVersion: lambda.aws.upbound.io/v1beta1
kind: Permission
metadata:
  name: vgurukool-contact-handler-public-invoke-function
  labels:
    app.kubernetes.io/name: vgurukool
    app.kubernetes.io/part-of: vgurukool-app
spec:
  forProvider:
    region: us-east-2
    action: lambda:InvokeFunction
    functionNameRef:
      name: vgurukool-contact-handler
    principal: "*"
  providerConfigRef:
    name: aws-provider-config
